services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: revenue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: revenue_leakage
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U revenue -d revenue_leakage']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
